name: check
on: [push, pull_request]
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/lint.py
      - name: build and check data/ is committed
        run: |
          python3 scripts/build_index.py
          git diff --exit-code --ignore-matching-lines='"generated"' -- data/ || (echo "data/ is stale: run python3 scripts/build_index.py and commit" && exit 1)
