name: check
on: [push, pull_request]
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python3 scripts/lint.py
      - name: build and check data/ and doc counts are committed
        run: |
          python3 scripts/build_index.py
          git diff --exit-code --ignore-matching-lines='"generated"' -- data/ index.html MUSE_PROMPT.md skill/SKILL.md openapi.json || (echo "data/ or doc counts are stale: run python3 scripts/build_index.py and commit" && exit 1)
